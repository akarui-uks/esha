<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esha ✨</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --cork-bg: #e2c9a9;
      --cork-pattern: radial-gradient(#d4b896 15%, transparent 16%), radial-gradient(#caa982 15%, transparent 16%);
      --polaroid-bg: #fffdfa;
      --accent-red: #e11d48;
      --pin-red: radial-gradient(circle at 35% 35%, #ff4d6d, #be123c 70%, #881337);
      --text: #292524;
      --text-muted: #78716c;
      --shadow-pin: 0 12px 24px -6px rgba(41, 37, 36, 0.25), 0 4px 10px rgba(0, 0, 0, 0.12);
      --font-note: 'Caveat', cursive;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--cork-bg);
      background-image: var(--cork-pattern);
      background-size: 32px 32px;
      background-position: 0 0, 16px 16px;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px 60px;
      box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.2);
    }

    .push-pin {
      width: 18px;
      height: 18px;
      background: var(--pin-red);
      border-radius: 50%;
      position: absolute;
      top: -9px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.35), inset 0 1px 2px rgba(255, 255, 255, 0.6);
      z-index: 10;
    }
    .push-pin::after {
      content: '';
      position: absolute;
      top: 5px;
      left: 5px;
      width: 4px;
      height: 4px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
    }

    #lockScreen {
      position: fixed;
      inset: 0;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: rgba(245, 240, 235, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }

    .lock-card {
      position: relative;
      background: var(--polaroid-bg);
      padding: 40px 32px 32px;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(0,0,0,0.06);
      text-align: center;
      max-width: 400px;
      width: 100%;
      transform: rotate(-1deg);
    }

    .lock-title {
      font-family: var(--font-note);
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.1;
      margin-bottom: 4px;
    }
    .lock-sub {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 24px;
    }

    .pin-group {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .pin-box {
      width: 36px;
      height: 48px;
      border: 1.5px solid #d6d3d1;
      border-radius: 6px;
      background: #fafaf9;
      text-align: center;
      font-size: 1.3rem;
      font-weight: 700;
      outline: none;
      color: var(--text);
      transition: all 0.2s;
    }
    .pin-box:focus {
      border-color: var(--accent-red);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.2);
    }
    .pin-err {
      color: var(--accent-red);
      font-size: 0.85rem;
      font-weight: 600;
      height: 20px;
    }

    #boardContent {
      display: none;
      width: 100%;
      max-width: 920px;
      animation: dropIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes dropIn {
      from { opacity: 0; transform: scale(0.96) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .board-header {
      position: relative;
      background: #fef08a;
      width: fit-content;
      margin: 0 auto 45px;
      padding: 14px 36px;
      border-radius: 4px;
      box-shadow: var(--shadow-pin);
      transform: rotate(1.5deg);
      text-align: center;
    }
    .board-header h1 {
      font-family: var(--font-note);
      font-size: 2.8rem;
      color: #713f12;
      line-height: 1;
    }

    .section-label {
      font-family: var(--font-note);
      font-size: 1.8rem;
      color: #44403c;
      margin-bottom: 18px;
      display: inline-block;
      background: rgba(255, 255, 255, 0.6);
      padding: 2px 14px;
      border-radius: 6px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 32px;
      margin-bottom: 60px;
    }

    .polaroid-card {
      position: relative;
      background: var(--polaroid-bg);
      padding: 14px 14px 20px;
      border-radius: 4px;
      box-shadow: var(--shadow-pin);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      cursor: pointer;
    }
    .polaroid-card:nth-child(1) { transform: rotate(-2deg); }
    .polaroid-card:nth-child(2) { transform: rotate(2.5deg); }
    .polaroid-card:nth-child(3) { transform: rotate(-1.5deg); }
    .polaroid-card:nth-child(4) { transform: rotate(3deg); }

    .polaroid-card:hover {
      transform: scale(1.04) rotate(0deg) !important;
      z-index: 20;
      box-shadow: 0 20px 35px -8px rgba(0, 0, 0, 0.35);
    }

    .polaroid-card img {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      display: block;
      border-radius: 2px;
      background: #e7e5e4;
    }

    .polaroid-caption {
      font-family: var(--font-note);
      font-size: 1.45rem;
      color: var(--text);
      text-align: center;
      margin-top: 12px;
    }

    .coming-soon-note {
      position: relative;
      background: #fed7aa;
      padding: 24px;
      border-radius: 4px;
      box-shadow: var(--shadow-pin);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 280px;
    }
    .coming-soon-note p {
      font-family: var(--font-note);
      font-size: 1.8rem;
      color: #7c2d12;
      line-height: 1.25;
    }

    .music-board-card {
      position: relative;
      background: var(--polaroid-bg);
      border-radius: 8px;
      padding: 30px 24px;
      box-shadow: var(--shadow-pin);
      max-width: 580px;
      margin: 0 auto;
      transform: rotate(-0.5deg);
    }

    .turntable-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }

    .vinyl-disc {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: repeating-radial-gradient(#18181b 0, #27272a 2px, #09090b 4px);
      border: 6px solid #18181b;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s;
    }
    .vinyl-label {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--accent-red);
      border: 4px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 0.9rem;
    }
    .spin {
      animation: spinVinyl 4s linear infinite;
    }
    @keyframes spinVinyl {
      100% { transform: rotate(360deg); }
    }

    .track-meta {
      text-align: center;
      margin-top: 14px;
    }
    .track-title {
      font-size: 1.25rem;
      font-weight: 700;
    }
    .track-artist {
      color: var(--text-muted);
      font-size: 1.2rem;
      font-family: var(--font-note);
    }

    .player-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin: 18px 0;
    }
    .ctrl-btn {
      padding: 8px 18px;
      border-radius: 999px;
      border: 1px solid #d6d3d1;
      background: #fff;
      color: var(--text);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .ctrl-btn.play-btn {
      background: var(--accent-red);
      color: #fff;
      border-color: var(--accent-red);
      padding: 10px 24px;
    }
    .ctrl-btn:hover { transform: scale(1.05); }

    .search-input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #e7e5e4;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      margin-bottom: 12px;
      background: #fafaf9;
    }
    .search-input:focus { border-color: var(--accent-red); background: #fff; }

    .playlist-scroll {
      list-style: none;
      max-height: 180px;
      overflow-y: auto;
    }
    .song-row {
      padding: 10px 12px;
      border-bottom: 1px solid #f5f5f4;
      display: flex;
      justify-content: space-between;
      cursor: pointer;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    .song-row:hover { background: #f5f5f4; }
    .song-row.active {
      background: #ffe4e6;
      color: var(--accent-red);
      font-weight: 600;
    }

    footer {
      text-align: center;
      margin-top: 50px;
    }
    .footer-note {
      font-family: var(--font-note);
      font-size: 1.5rem;
      color: #57534e;
    }
    .footer-note span {
      color: var(--accent-red);
    }
  </style>
</head>
<body>

  <div id="lockScreen">
    <div class="lock-card">
      <div class="push-pin"></div>
      <h2 class="lock-title">Pinned for Esha ✨</h2>
      <p class="lock-sub">Enter your 8-digit birthday code (DDMMYYYY)</p>
      <div class="pin-group">
        <input type="password" maxlength="1" class="pin-box" autofocus inputmode="numeric">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
      </div>
      <div id="pinMsg" class="pin-err"></div>
    </div>
  </div>

  <div id="boardContent">
    
    <header class="board-header">
      <div class="push-pin"></div>
      <h1>Esha's Corner 📌</h1>
    </header>

    <span class="section-label">Moments & Memories 📷</span>
    <div class="gallery-grid">
      
      <div class="polaroid-card">
        <div class="push-pin"></div>
        <img src="photo1.jpg" alt="Memory 1">
        <div class="polaroid-caption">pure sunshine ☀️</div>
      </div>

      <div class="polaroid-card">
        <div class="push-pin"></div>
        <img src="photo2.jpg" alt="Memory 2">
        <div class="polaroid-caption">unforgettable days ✨</div>
      </div>

      <div class="polaroid-card">
        <div class="push-pin"></div>
        <img src="photo3.jpg" alt="Memory 3">
        <div class="polaroid-caption">stay iconic 🌸</div>
      </div>

      <div class="coming-soon-note">
        <div class="push-pin"></div>
        <p>✨ More photos coming soon...</p>
      </div>

    </div>

    <div style="text-align: center; margin-bottom: 12px;">
      <span class="section-label">Favorite Tunes 🎵</span>
    </div>
    
    <div class="music-board-card">
      <div class="push-pin"></div>
      
      <div class="turntable-wrapper">
        <div id="disc" class="vinyl-disc">
          <div class="vinyl-label">❤</div>
        </div>
        <div class="track-meta">
          <div id="currTitle" class="track-title">Select a Song</div>
          <div id="currArtist" class="track-artist">—</div>
        </div>
      </div>

      <audio id="audioElement"></audio>

      <div class="player-controls">
        <button class="ctrl-btn" onclick="prevSong()">⏮ Prev</button>
        <button id="playBtn" class="ctrl-btn play-btn" onclick="togglePlay()">▶ Play</button>
        <button class="ctrl-btn" onclick="nextSong()">Next ⏭</button>
      </div>

      <input type="text" id="searchBar" class="search-input" placeholder="🔍 Search favorite songs..." oninput="filterSongs()">
      <ul id="songList" class="playlist-scroll"></ul>
    </div>

    <footer>
      <p class="footer-note">made with <span>❤</span> for esha</p>
    </footer>

  </div>

  <script>
    const TARGET_PIN = "29102007";
    const inputs = document.querySelectorAll('.pin-box');
    const pinMsg = document.getElementById('pinMsg');

    inputs.forEach((input, idx) => {
      input.addEventListener('input', () => {
        if (input.value && idx < inputs.length - 1) inputs[idx + 1].focus();
        checkPin();
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && idx > 0) inputs[idx - 1].focus();
      });
    });

    function checkPin() {
      const entered = Array.from(inputs).map(i => i.value).join('');
      if (entered.length === 8) {
        if (entered === TARGET_PIN) {
          document.getElementById('lockScreen').style.display = 'none';
          document.getElementById('boardContent').style.display = 'block';
        } else {
          pinMsg.textContent = "Incorrect code";
          inputs.forEach(i => i.value = '');
          inputs[0].focus();
        }
      }
    }

    const playlist = [
      { title: "Multo", artist: "Cup of Joe", src: "multo.mp3" },
      { title: "Be kind", artist: "Halsey", src: "bekind.mp3" },
      { title: "Worst of you", artist: "Maisie Peter", src: "worstofu.mp3" }
    ];

    let currentIndex = 0;
    const audio = document.getElementById('audioElement');
    const disc = document.getElementById('disc');
    const playBtn = document.getElementById('playBtn');

    function renderSongs(list) {
      const ul = document.getElementById('songList');
      ul.innerHTML = '';
      list.forEach((s) => {
        const li = document.createElement('li');
        li.className = `song-row ${playlist.indexOf(s) === currentIndex ? 'active' : ''}`;
        li.innerHTML = `<span>${s.title}</span><span style="color:var(--text-muted); font-size:0.85rem">${s.artist}</span>`;
        li.onclick = () => loadAndPlay(playlist.indexOf(s));
        ul.appendChild(li);
      });
    }

    function loadAndPlay(idx) {
      currentIndex = idx;
      const s = playlist[idx];
      audio.src = s.src;
      document.getElementById('currTitle').textContent = s.title;
      document.getElementById('currArtist').textContent = s.artist;
      audio.play().then(() => {
        disc.classList.add('spin');
        playBtn.textContent = '⏸ Pause';
      }).catch(() => {});
      renderSongs(playlist);
    }

    function togglePlay() {
      if (!audio.src) { loadAndPlay(0); return; }
      if (audio.paused) {
        audio.play();
        disc.classList.add('spin');
        playBtn.textContent = '⏸ Pause';
      } else {
        audio.pause();
        disc.classList.remove('spin');
        playBtn.textContent = '▶ Play';
      }
    }

    function prevSong() {
      currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
      loadAndPlay(currentIndex);
    }

    function nextSong() {
      currentIndex = (currentIndex + 1) % playlist.length;
      loadAndPlay(currentIndex);
    }

    function filterSongs() {
      const q = document.getElementById('searchBar').value.toLowerCase();
      renderSongs(playlist.filter(s => s.title.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q)));
    }

    audio.onended = nextSong;
    renderSongs(playlist);
  </script>
</body>
</html>
