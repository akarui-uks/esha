<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esha ⚡</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-board: #0f172a;
      --board-pattern: radial-gradient(#1e293b 15%, transparent 16%), radial-gradient(#0b1120 15%, transparent 16%);
      --card-bg: #ffffff;
      --card-alt: #1e293b;
      --accent-blue: #38bdf8;
      --accent-navy: #1d4ed8;
      --pin-dark: radial-gradient(circle at 35% 35%, #60a5fa, #1d4ed8 70%, #0f172a);
      --text-main: #0f172a;
      --text-light: #f8fafc;
      --text-muted: #64748b;
      --shadow-pin: 0 16px 30px -8px rgba(0, 0, 0, 0.6), 0 4px 12px rgba(0, 0, 0, 0.4);
      --font-note: 'Caveat', cursive;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-board);
      background-image: var(--board-pattern);
      background-size: 28px 28px;
      background-position: 0 0, 14px 14px;
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 16px 70px;
      box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.8);
    }

    /* Metallic Silver / Blue Push Pin */
    .push-pin {
      width: 18px;
      height: 18px;
      background: var(--pin-dark);
      border-radius: 50%;
      position: absolute;
      top: -9px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.7);
      z-index: 10;
    }
    .push-pin::after {
      content: '';
      position: absolute;
      top: 4px;
      left: 4px;
      width: 4px;
      height: 4px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 50%;
    }

    /* Lock Screen */
    #lockScreen {
      position: fixed;
      inset: 0;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(15, 23, 42, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }

    .lock-card {
      position: relative;
      background: #ffffff;
      padding: 42px 32px 36px;
      border-radius: 16px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      text-align: center;
      max-width: 400px;
      width: 100%;
      transform: rotate(-1deg);
      color: var(--text-main);
    }

    .lock-title {
      font-family: var(--font-note);
      font-size: 2.3rem;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 4px;
      color: #0f172a;
    }
    .lock-sub {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 24px;
    }

    .pin-group {
      display: flex;
      justify-content: center;
      gap: 7px;
      margin-bottom: 16px;
    }
    .pin-box {
      width: 36px;
      height: 48px;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      background: #f8fafc;
      text-align: center;
      font-size: 1.3rem;
      font-weight: 700;
      outline: none;
      color: #0f172a;
      transition: all 0.2s;
    }
    .pin-box:focus {
      border-color: var(--accent-navy);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.2);
    }
    .pin-err {
      color: #ef4444;
      font-size: 0.85rem;
      font-weight: 600;
      height: 20px;
    }

    /* Main Board */
    #boardContent {
      display: none;
      width: 100%;
      max-width: 940px;
      animation: dropIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes dropIn {
      from { opacity: 0; transform: scale(0.96) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .board-header {
      position: relative;
      background: #ffffff;
      width: fit-content;
      margin: 0 auto 45px;
      padding: 12px 34px;
      border-radius: 6px;
      box-shadow: var(--shadow-pin);
      transform: rotate(1deg);
      text-align: center;
    }
    .board-header h1 {
      font-family: var(--font-note);
      font-size: 2.8rem;
      color: #0f172a;
      line-height: 1;
    }
    .board-header span {
      color: var(--accent-navy);
    }

    .section-label {
      font-family: var(--font-note);
      font-size: 1.85rem;
      color: var(--accent-blue);
      margin-bottom: 20px;
      display: inline-block;
      background: rgba(30, 41, 59, 0.75);
      border: 1px solid rgba(56, 189, 248, 0.2);
      padding: 4px 16px;
      border-radius: 8px;
    }

    /* Polaroid Gallery */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 32px;
      margin-bottom: 60px;
    }

    .polaroid-card {
      position: relative;
      background: #ffffff;
      padding: 14px 14px 22px;
      border-radius: 6px;
      box-shadow: var(--shadow-pin);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      cursor: pointer;
      color: var(--text-main);
    }
    .polaroid-card:nth-child(1) { transform: rotate(-2deg); }
    .polaroid-card:nth-child(2) { transform: rotate(2.5deg); }
    .polaroid-card:nth-child(3) { transform: rotate(-1.5deg); }

    .polaroid-card:hover {
      transform: scale(1.04) rotate(0deg) !important;
      z-index: 20;
      box-shadow: 0 24px 40px rgba(0, 0, 0, 0.6);
    }

    .polaroid-card img {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      display: block;
      border-radius: 4px;
      background: #e2e8f0;
    }

    .polaroid-caption {
      font-family: var(--font-note);
      font-size: 1.5rem;
      color: #0f172a;
      text-align: center;
      margin-top: 14px;
    }

    .coming-soon-card {
      position: relative;
      background: #1e293b;
      border: 2px dashed #475569;
      padding: 24px;
      border-radius: 6px;
      box-shadow: var(--shadow-pin);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 280px;
      transform: rotate(2deg);
    }
    .coming-soon-card p {
      font-family: var(--font-note);
      font-size: 1.85rem;
      color: var(--accent-blue);
      line-height: 1.3;
    }

    /* Pinned Audio Player Box */
    .music-board-card {
      position: relative;
      background: #ffffff;
      border-radius: 12px;
      padding: 34px 28px;
      box-shadow: var(--shadow-pin);
      max-width: 540px;
      margin: 0 auto;
      color: var(--text-main);
      transform: rotate(-0.5deg);
    }

    .cover-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 18px;
    }

    /* Song Cover Art (Replaces Vinyl Disc) */
    .song-cover {
      width: 190px;
      height: 190px;
      border-radius: 12px;
      object-fit: cover;
      display: block;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
      border: 3px solid #f1f5f9;
      background-color: #0f172a;
      transition: transform 0.25s ease;
    }
    .song-cover:hover {
      transform: scale(1.02);
    }

    .track-meta {
      text-align: center;
      margin-top: 14px;
    }
    .track-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #0f172a;
    }
    .track-artist {
      color: var(--text-muted);
      font-size: 1.15rem;
      font-family: var(--font-note);
    }

    .player-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin: 20px 0;
    }
    .ctrl-btn {
      padding: 10px 20px;
      border-radius: 9999px;
      border: 1.5px solid #cbd5e1;
      background: #ffffff;
      color: #0f172a;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .ctrl-btn.play-btn {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
      padding: 12px 28px;
    }
    .ctrl-btn:hover {
      transform: scale(1.04);
      border-color: #0f172a;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      margin-bottom: 12px;
      background: #f8fafc;
      font-family: inherit;
    }
    .search-input:focus {
      border-color: var(--accent-navy);
      background: #ffffff;
    }

    .playlist-scroll {
      list-style: none;
      max-height: 180px;
      overflow-y: auto;
    }
    .song-row {
      padding: 12px 14px;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 500;
      transition: background 0.15s ease;
    }
    .song-row:hover {
      background: #f1f5f9;
    }
    .song-row.active {
      background: #eff6ff;
      color: var(--accent-navy);
      font-weight: 700;
    }

    footer {
      text-align: center;
      margin-top: 55px;
    }
    .footer-note {
      font-family: var(--font-note);
      font-size: 1.6rem;
      color: #94a3b8;
    }
    .footer-note span {
      color: #ef4444;
    }
  </style>
</head>
<body>

  <!-- 8-Digit Code Entry -->
  <div id="lockScreen">
    <div class="lock-card">
      <div class="push-pin"></div>
      <h2 class="lock-title">Pinned for her 💕</h2>
      <p class="lock-sub">Enter the code</p>
      <div class="pin-group">
        <input type="password" maxlength="1" class="pin-box" autofocus inputmode="numeric">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
      </div>
      <div id="pinMsg" class="pin-err"></div>
    </div>
  </div>

  <div id="boardContent">
    
    <header class="board-header">
      <div class="push-pin"></div>
      <h1>Esha's Board <span>⚡</span></h1>
    </header>

    <!-- Pinned Photos -->
    <span class="section-label">Moments & Memories 📷</span>
    <div class="gallery-grid">
      
      <div class="polaroid-card">
        <div class="push-pin"></div>
        <img src="photo1.jpg" alt="Memory 1">
        <div class="polaroid-caption">immersive eyes ⚡</div>
      </div>

      <div class="polaroid-card">
        <div class="push-pin"></div>
        <img src="photo2.jpg" alt="Memory 2">
        <div class="polaroid-caption">the look u give ✨</div>
      </div>

      <div class="polaroid-card">
        <div class="push-pin"></div>
        <img src="photo3.jpg" alt="Memory 3">
        <div class="polaroid-caption">wave of cuteness 🌊</div>
      </div>

      <div class="coming-soon-card">
        <div class="push-pin"></div>
        <p>⚡ send more pics...</p>
      </div>

    </div>

    <!-- Pinned Soundtracks Section -->
    <div style="text-align: center; margin-bottom: 16px;">
      <span class="section-label">Favorite Soundtracks 🎵</span>
    </div>
    
    <div class="music-board-card">
      <div class="push-pin"></div>
      
      <div class="cover-wrapper">
        <!-- Song Cover Image matching audio filename (.jpg) -->
        <img id="songCoverImg" class="song-cover" src="multo.jpg" alt="Song Cover" onerror="this.src='photo1.jpg'">
        <div class="track-meta">
          <div id="currTitle" class="track-title">Multo</div>
          <div id="currArtist" class="track-artist">Cup of Joe</div>
        </div>
      </div>

      <audio id="audioElement" preload="auto"></audio>

      <div class="player-controls">
        <button class="ctrl-btn" onclick="prevSong()">⏮ Prev</button>
        <button id="playBtn" class="ctrl-btn play-btn" onclick="togglePlay()">▶ Play</button>
        <button class="ctrl-btn" onclick="nextSong()">Next ⏭</button>
      </div>

      <input type="text" id="searchBar" class="search-input" placeholder="🔍 Search songs..." oninput="filterSongs()">
      <ul id="songList" class="playlist-scroll"></ul>
    </div>

    <footer>
      <p class="footer-note">curated with <span>❤️</span> for esha</p>
    </footer>

  </div>

  <script>
    // 1. PIN Gate Logic (29102007)
    const TARGET_PIN = "29102007";
    const inputs = document.querySelectorAll('.pin-box');
    const pinMsg = document.getElementById('pinMsg');

    inputs.forEach((input, idx) => {
      input.addEventListener('input', () => {
        if (input.value && idx < inputs.length - 1) inputs[idx + 1].focus();
        checkPin();
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && idx > 0) inputs[idx - 1].focus();
      });
    });

    function checkPin() {
      const entered = Array.from(inputs).map(i => i.value).join('');
      if (entered.length === 8) {
        if (entered === TARGET_PIN) {
          document.getElementById('lockScreen').style.display = 'none';
          document.getElementById('boardContent').style.display = 'block';
          initPlayer();
        } else {
          pinMsg.textContent = "Incorrect code";
          inputs.forEach(i => i.value = '');
          inputs[0].focus();
        }
      }
    }

    // 2. Playlist & Player Logic 
    const playlist = [
      { 
        title: "Multo", 
        artist: "Cup of Joe", 
        src: "multo.mp3", 
        img: "multojpg" // <-- Name whatever image you want
      },
      { 
        title: "Be Kind", 
        artist: "Halsey", 
        src: "bekind.mp3", 
        img: "bekind.jpg" // <-- Custom image name
      },
      { 
        title: "Worst of You", 
        artist: "Maisie Peters", 
        src: "worstofu.mp3", 
        img: "worstofu.jpg" // <-- Custom image name
      }
    ];

    let currentIndex = 0;
    const audio = document.getElementById('audioElement');
    const coverImg = document.getElementById('songCoverImg');
    const playBtn = document.getElementById('playBtn');

    function updateTrackDisplay(s) {
      document.getElementById('currTitle').textContent = s.title;
      document.getElementById('currArtist').textContent = s.artist;
      // Derive image name by swapping .mp3 for .jpg
      const imgPath = s.src.replace(/\.[^/.]+$/, "") + ".jpg";
      coverImg.src = imgPath;
    }

    function initPlayer() {
      const s = playlist[currentIndex];
      audio.src = s.src;
      updateTrackDisplay(s);
      renderSongs(playlist);
    }

    function renderSongs(list) {
      const ul = document.getElementById('songList');
      ul.innerHTML = '';
      list.forEach((s) => {
        const originalIndex = playlist.indexOf(s);
        const li = document.createElement('li');
        li.className = `song-row ${originalIndex === currentIndex ? 'active' : ''}`;
        li.innerHTML = `<span>${s.title}</span><span style="color:var(--text-muted); font-size:0.85rem">${s.artist}</span>`;
        li.onclick = () => loadAndPlay(originalIndex);
        ul.appendChild(li);
      });
    }

    function loadAndPlay(idx) {
      currentIndex = idx;
      const s = playlist[idx];
      audio.src = s.src;
      updateTrackDisplay(s);
      
      audio.play().then(() => {
        playBtn.textContent = '⏸ Pause';
      }).catch(err => {
        console.warn("Audio playback gesture needed:", err);
      });
      renderSongs(playlist);
    }

    function togglePlay() {
      if (!audio.src) {
        loadAndPlay(0);
        return;
      }
      if (audio.paused) {
        audio.play().then(() => {
          playBtn.textContent = '⏸ Pause';
        }).catch(err => console.error("Playback error:", err));
      } else {
        audio.pause();
        playBtn.textContent = '▶ Play';
      }
    }

    function prevSong() {
      currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
      loadAndPlay(currentIndex);
    }

    function nextSong() {
      currentIndex = (currentIndex + 1) % playlist.length;
      loadAndPlay(currentIndex);
    }

    function filterSongs() {
      const q = document.getElementById('searchBar').value.toLowerCase();
      renderSongs(playlist.filter(s => s.title.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q)));
    }

    audio.onended = nextSong;
  </script>
</body>
</html>
